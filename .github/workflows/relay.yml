name: relay

on:
  push:
  pull_request:

jobs:
  relay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare bus
        shell: pwsh
        run: |
          Copy-Item rules.example.json rules.json
          foreach ($a in 'node','project-a','project-b','public-site') {
            foreach ($d in 'inbox','outbox','rejected') {
              New-Item -ItemType Directory -Force "$a\mailbox\$d" | Out-Null
            }
          }
          New-Item -ItemType Directory -Force mailbox | Out-Null
          # в CI пути реальные: репозитории — каталоги раннера, а не C:\path\to
          $cfg = Get-Content rules.json -Raw | ConvertFrom-Json
          foreach ($a in 'node','project-a','project-b','public-site') {
            $cfg.repos.$a = Join-Path $PWD $a
          }
          $cfg.bus_root = Join-Path $PWD 'mailbox'
          $cfg | ConvertTo-Json -Depth 8 | Set-Content rules.json
          Copy-Item examples/request.md node\mailbox\outbox\0001.md
          Copy-Item examples/rejected-lateral.md project-a\mailbox\outbox\0002.md

      - name: Run relay
        shell: pwsh
        run: |
          ./relay.ps1
          $code = $LASTEXITCODE
          Write-Host "relay exit code: $code"
          if ($code -ne 0 -and $code -ne 1) { throw "relay failed with $code" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Assert delivery and rejection
        shell: pwsh
        run: |
          $inbox = @(Get-ChildItem project-a\mailbox\inbox -File)
          if ($inbox.Count -ne 1) { throw "expected 1 delivered message, got $($inbox.Count)" }
          $rejected = @(Get-ChildItem project-a\mailbox\rejected -Filter *.md -File)
          if ($rejected.Count -ne 1) { throw "expected 1 rejected message, got $($rejected.Count)" }
          $reason = Get-ChildItem project-a\mailbox\rejected -Filter *.reason | Select-Object -First 1
          if (-not $reason) { throw "rejection reason file is missing" }
          $journal = Get-Content mailbox\journal.log -Raw
          if ($journal -notmatch 'ACCEPT from=node to=project-a') { throw "no ACCEPT line in journal" }
          if ($journal -notmatch 'REJECT from=project-a') { throw "no REJECT line in journal" }

  bus:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: bus self-test
        shell: pwsh
        run: ./test-files.ps1

  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: desk self-test
        run: python3 desk/owner-desk.py selftest
